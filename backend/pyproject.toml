[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpilot-local-api"
version = "0.1.0"
description = "Minimal local FastAPI service for MCPilot development"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "python-dotenv==1.2.4",
  "uvicorn==0.54.0",
  "mcp==2.3.0",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

